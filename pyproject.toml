[project]
name = "campoedados"
version = "0.6.5"
description = "Núcleo modular do Campo e Dados"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.48,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.13,<3",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "openai>=1.0,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "cryptography>=42,<48",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
