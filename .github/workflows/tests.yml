name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campoedados
          POSTGRES_PASSWORD: campoedados
          POSTGRES_DB: campoedados_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campoedados -d campoedados_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: PostgreSQL migration smoke test
        env:
          MIGRATION_DATABASE_URL: postgresql://campoedados:campoedados@localhost:5432/campoedados_test
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          url = "postgresql+psycopg://campoedados:campoedados@localhost:5432/campoedados_test"
          engine = create_engine(url)
          tables = set(inspect(engine).get_table_names())
          expected = {
              "organizations", "system_modules", "users", "units", "organization_modules",
              "memberships", "access_tokens", "user_module_permissions", "events",
              "event_module_targets", "event_documents", "approvals", "audit_entries",
              "products", "recipes", "recipe_ingredients", "inventory_balances",
              "inventory_movements", "production_batches", "transfers", "suppliers",
              "cost_centers", "purchases", "accounts_payable", "purchase_allocations",
              "channel_identities", "channel_accounts", "channel_contact_requests",
              "user_credentials", "alembic_version",
          }
          missing = expected - tables
          assert not missing, f"Tabelas ausentes após migration: {sorted(missing)}"
          with engine.connect() as con:
              protected = set(
                  con.execute(text("select relname from pg_class where relkind='r' and relrowsecurity=true"))
                  .scalars()
              )
              token_hash_indexes = con.execute(
                  text("""
                      select count(*)
                      from pg_indexes
                      where schemaname='public'
                        and tablename='access_tokens'
                        and indexdef like '%(token_hash)%'
                  """)
              ).scalar_one()
          assert expected <= protected, f"Tabelas sem RLS: {sorted(expected - protected)}"
          assert token_hash_indexes == 1, "access_tokens.token_hash deve ter apenas um índice único"
          print(f"migration ok: {len(tables)} tables; rls ok: {len(expected)} tables; token_hash index ok")
          PY
      - name: Test
        run: python -m pytest
