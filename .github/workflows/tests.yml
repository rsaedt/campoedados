name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campoedados
          POSTGRES_PASSWORD: campoedados
          POSTGRES_DB: campoedados_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campoedados -d campoedados_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: PostgreSQL migration smoke test
        env:
          MIGRATION_DATABASE_URL: postgresql://campoedados:campoedados@localhost:5432/campoedados_test
        run: |
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          url = "postgresql+psycopg://campoedados:campoedados@localhost:5432/campoedados_test"
          tables = set(inspect(create_engine(url)).get_table_names())
          expected = {
              "organizations", "system_modules", "users", "units", "organization_modules",
              "memberships", "access_tokens", "user_module_permissions", "events",
              "event_module_targets", "event_documents", "approvals", "audit_entries",
              "products", "recipes", "recipe_ingredients", "inventory_balances",
              "inventory_movements", "production_batches", "transfers", "suppliers",
              "cost_centers", "purchases", "accounts_payable", "purchase_allocations",
              "channel_identities", "alembic_version",
          }
          missing = expected - tables
          assert not missing, f"Tabelas ausentes após migration: {sorted(missing)}"
          print(f"migration ok: {len(tables)} tables")
          PY
      - name: Staging bootstrap is idempotent and modular
        env:
          DATABASE_URL: postgresql://campoedados:campoedados@localhost:5432/campoedados_test
          CAMPOEDADOS_BOOTSTRAP_ENABLED: "true"
          CAMPOEDADOS_BOOTSTRAP_ORG_NAME: Agropecuária Homologação
          CAMPOEDADOS_BOOTSTRAP_ORG_SLUG: agro-staging
          CAMPOEDADOS_BOOTSTRAP_ADMIN_NAME: Admin Staging
          CAMPOEDADOS_BOOTSTRAP_ADMIN_EMAIL: admin@staging.test
          CAMPOEDADOS_BOOTSTRAP_ADMIN_TOKEN: staging-token-test-only
          CAMPOEDADOS_BOOTSTRAP_UNITS_JSON: '[{"code":"SH7","name":"SH7"},{"code":"NSG","name":"NSG"}]'
          CAMPOEDADOS_BOOTSTRAP_MODULES: feed_mill,finance
          CAMPOEDADOS_BOOTSTRAP_CHANNEL_IDENTITIES_JSON: '[]'
        run: |
          python -m app.cli.bootstrap_staging
          python -m app.cli.bootstrap_staging
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql+psycopg://campoedados:campoedados@localhost:5432/campoedados_test")
          with engine.connect() as con:
              assert con.execute(text("select count(*) from organizations where slug='agro-staging'")).scalar_one() == 1
              assert con.execute(text("select count(*) from units")).scalar_one() == 2
              assert con.execute(text("select count(*) from access_tokens")).scalar_one() == 1
              enabled = set(con.execute(text("select module_code from organization_modules where enabled=true")).scalars())
              assert enabled == {"feed_mill", "finance"}
          print("bootstrap ok")
          PY
      - name: Test
        run: python -m pytest
